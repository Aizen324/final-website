apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailmates-app
  namespace: tailmates
spec:
  selector:
    matchLabels:
      app: tailmates-app
  template:
    metadata:
      labels:
        app: tailmates-app
    spec:
      containers:
      - name: tailmates-app
        image: tailmates-app:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_ROOT_PASSWORD
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: lb-service
  namespace: tailmates
spec:
  type: LoadBalancer
  selector:
    app: tailmates-app
  ports:
  - port: 80
    targetPort: 80
