apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: tailmates
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: dGFpbG1hdGVz
  MYSQL_PASSWORD: dGFpbG1hdGVz

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: tailmates
data:
  DB_HOST: mysql-service
  DB_NAME: tailmatesdb
  DB_USER: root

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  hostPath:
    path: "/mnt/data"

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: tailmates
spec:
  storageClassName: manual
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: tailmates
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent

        ports:
          - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: MYSQL_ROOT_PASSWORD
        
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        - name: tailmates-initdb
          mountPath: /docker-entrypoint-initdb.d/tailmatesdb.sql
          subPath: tailmatesdb.sql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: tailmates-initdb
        configMap:
          name: mysql-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: tailmates
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql